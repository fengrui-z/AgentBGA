name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: python -m pip install "pre-commit==4.6.1"

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  python-tests:
    name: python-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run Python tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Build and smoke-test installed wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir wheelhouse
          python -m pip install --force-reinstall wheelhouse/agentbga-*.whl
          cd "$(mktemp -d)"
          env -u PYTHONPATH python -c "from agentbga.registry import get_game; assert get_game('ark_nova').describe()['runnable']"

  web-tests:
    name: web-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
