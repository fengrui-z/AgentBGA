# PR-Agent: AI-powered PR review agent.
# Model: qwen3.7-plus via Alibaba DashScope (coding endpoint), OpenAI-compatible.
# Docs: https://docs.pr-agent.ai/installation/github/

name: PR-Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr_agent_job:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Automatic runs are limited to trusted, same-repository PRs. A trusted
    # maintainer can explicitly review a fork with one of the exact commands
    # below. Ordinary comments and edits must not trigger paid model calls.
    if: >-
      github.event.sender.type != 'Bot' && (
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
        ) || (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
          contains(fromJSON('["/review", "/describe", "/improve"]'), github.event.comment.body)
        )
      )
    # Scope concurrency to the eligible job so ignored public comments cannot
    # cancel an authorized review at workflow level.
    concurrency:
      group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - name: PR Agent action step
        id: pragent
        # Official 0.47.0-github_action image. Pin the runtime itself: the
        # upstream action wrapper otherwise pulls a rolling Docker tag.
        uses: docker://pragent/pr-agent@sha256:31b9aac6ab067bada9a0c1b001d30ebc500ea4487e00a93c18c59b9ef5fa66db
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # DashScope (coding endpoint) via OpenAI-compatible API.
          OPENAI__KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          OPENAI__API_BASE: "https://coding.dashscope.aliyuncs.com/v1"
          # Model routing: treat DashScope endpoint as an OpenAI-like API.
          config.model: "openai/qwen3.7-plus"
          config.fallback_models: "[\"openai/qwen3.7-plus\"]"
          config.custom_model_max_tokens: "65536"
          # Auto commands on PR open/update (set a value to "false" to disable).
          github_action_config.auto_describe: "true"
          github_action_config.auto_review: "true"
          github_action_config.auto_improve: "true"
